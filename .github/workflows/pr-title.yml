# Pull requests are squash-merged, so the PR title becomes the commit on main. release-please
# reads those commits to pick the next version and write the changelog, so the title must be a
# Conventional Commit: type(optional-scope)!: summary
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*$'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title is not a Conventional Commit: \"$TITLE\""
            echo "Expected: type(optional-scope): summary — for example \"feat(garage): add vehicle home\"."
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert. Add ! before the colon for a breaking change."
            exit 1
          fi
