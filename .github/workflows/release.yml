# Push a tag like v0.1.0 → builds a signed release APK and attaches it to a GitHub Release.
# Obtainium watches the Releases page of this repo.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (domain + app)
        run: ./gradlew :domain:test :app:testReleaseUnitTest

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        run: ./gradlew :app:assembleRelease -PversionName=${GITHUB_REF_NAME#v} -PversionCode=${{ github.run_number }}
        env:
          GLOVEBOX_KEYSTORE: ${{ runner.temp }}/release.jks
          GLOVEBOX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GLOVEBOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GLOVEBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "glovebox-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: glovebox-${{ github.ref_name }}.apk
