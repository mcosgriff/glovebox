# Builds a signed release APK for a tag like v0.1.0 and attaches it to that tag's GitHub Release,
# with a SHA-256 checksum and a build-provenance attestation.
# Normally started by release-please.yml when its release PR is merged; pushing a v* tag by hand
# also works.
# Obtainium watches the Releases page of this repo.
# This workflow sees the signing key, so every action is pinned to a commit SHA
# (Dependabot keeps the pins current).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # run against a v* tag (release-please.yml does this)

# Read-only unless a job says otherwise (OpenSSF Scorecard's Token-Permissions, #246).
permissions:
  contents: read

jobs:
  build:
    # Only ever build a release from a version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      id-token: write      # sign the provenance attestation
      attestations: write  # store the attestation
    # The signing secrets live in this environment, which requires approval and only accepts v* tags.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The same unit tests as CI, migration tests included. The Android plugin makes unit tests for the
      # debug build only, so there is no testReleaseUnitTest; the release build is checked by being built.
      - name: Unit tests
        run: ./gradlew :domain:test testDebugUnitTest

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        run: ./gradlew :app:assembleRelease -PversionName=${GITHUB_REF_NAME#v} -PversionCode=${{ github.run_number }}
        env:
          GLOVEBOX_KEYSTORE: ${{ runner.temp }}/release.jks
          GLOVEBOX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GLOVEBOX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GLOVEBOX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Rename APK and write checksum
        run: |
          apk="glovebox-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"

      # Exodus Privacy's tracker scanner on the signed APK (#217). A tracker, or a permission that isn't in
      # .github/privacy/permissions.txt, stops the release here, before anything is published. The keystore
      # is already gone, and the container sees only a copy of the APK.
      - name: Exodus tracker scan
        run: |
          .github/scripts/exodus-scan.sh "glovebox-${GITHUB_REF_NAME}.apk" "$RUNNER_TEMP/exodus"
          cp "$RUNNER_TEMP/exodus/exodus.json" "glovebox-${GITHUB_REF_NAME}.exodus.json"
          { echo; cat "$RUNNER_TEMP/exodus/exodus-summary.md"; } > exodus-notes.md

      # Lets anyone verify the APK came from this workflow and tag:
      #   gh attestation verify glovebox-vX.Y.Z.apk --repo <owner>/glovebox
      # The same signed provenance is attached to the release as glovebox-vX.Y.Z.apk.intoto.jsonl, for
      # verifying without GitHub's API and for OpenSSF Scorecard's Signed-Releases check (#246).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: glovebox-${{ github.ref_name }}.apk

      - name: Keep the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "glovebox-${GITHUB_REF_NAME}.apk.intoto.jsonl"

      # Attach the files and add the scan's summary after the changelog release-please wrote. Done with gh
      # rather than softprops/action-gh-release: from 0.11.0 GitHub refused that action's "update a release"
      # call (403, "Resource not accessible by integration"), which also sends the tag name and commit.
      # `gh release upload` and `gh release edit --notes-file` send only the assets and the notes.
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            # A tag pushed by hand has no release yet.
            gh release create "$tag" --verify-tag --title "$tag" --notes ""
          fi
          gh release upload "$tag" --clobber \
            "glovebox-$tag.apk" "glovebox-$tag.apk.sha256" "glovebox-$tag.exodus.json" \
            "glovebox-$tag.apk.intoto.jsonl"
          # A re-run must not add the summary twice.
          gh release view "$tag" --json body -q .body > notes.md
          if ! grep -q "Exodus Privacy scan" notes.md; then
            cat exodus-notes.md >> notes.md
            gh release edit "$tag" --notes-file notes.md
          fi
