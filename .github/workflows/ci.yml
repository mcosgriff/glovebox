# Runs on every pull request and push to main.
# Action versions are pinned to commit SHAs; Dependabot keeps them current.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Started by dependabot-verification.yml after it pushes updated verification metadata to a
  # Dependabot branch: a push made with GITHUB_TOKEN doesn't start workflows by itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The bulletins extract script's own tests (scripts/bulletins.py, #459), run with uv like every helper script.
      - name: Script tests
        run: pipx run --spec uv==0.13.5 uv run scripts/test_bulletins.py

      # The unit tests, with Kover measuring them; the merged report goes to Codecov.
      - name: Unit tests
        run: ./gradlew :domain:test testDebugUnitTest koverXmlReportCoverage

      # Coverage only: a failed upload doesn't fail the build. CODECOV_TOKEN is a repository secret, so
      # a pull request from a fork uploads nothing.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/reportCoverage.xml
          disable_search: true
          fail_ci_if_error: false

      - name: Android lint
        run: ./gradlew :app:lintDebug

      # Release builds run R8; catches shrinking problems with Room, Hilt and serialization
      # before a tag does. No signing secrets here, so the APK is unsigned.
      - name: Debug + release builds
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      # Exodus Privacy's tracker scanner on that release APK: no tracker, and no permission that isn't in
      # .github/privacy/permissions.txt. The same check as release.yml, so a problem shows before merging.
      - name: Exodus tracker scan
        run: .github/scripts/exodus-scan.sh app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/exodus"

      # Room exports schemas during compilation. A change here that isn't committed usually
      # means a schema change without its migration — data loss on an encrypted DB.
      - name: Room schemas committed
        run: |
          if [ -n "$(git status --porcelain -- data/schemas)" ]; then
            echo "::error::Room schema changed but data/schemas isn't committed. Commit the new schema JSON and add a migration."
            git status --porcelain -- data/schemas
            exit 1
          fi

      # The screenshot tests (#233) run with the unit tests: on a mismatch, Roborazzi writes each screen as
      # drawn now beside its reference and the difference (`*_compare.png`).
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-differences
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

      # Each test's output and the HTML report, for a failure that only happens here.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            */build/test-results/
            */build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # The app driven on an emulator, from first launch to a restored backup (EndToEndTest), and the
  # text reader on real native code (TextReaderTest). A fresh emulator every run, so the tests' rule
  # of only running on a fresh install holds. connectedDebugAndroidTest is fine here: it uninstalls
  # the app afterwards, which only matters on a device that has someone's data on it.
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # A phone-sized screen; the default is a small one that puts most of each screen below the fold.
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: end-to-end-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
