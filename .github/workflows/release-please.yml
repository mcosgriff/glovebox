# Keeps a "release PR" open on main. It reads the Conventional Commits since the last release,
# works out the next semantic version (fix → patch, feat → minor, breaking → major) and updates
# CHANGELOG.md and version.txt. Merging that PR tags vX.Y.Z, creates the GitHub Release, and
# starts the signed build in release.yml for the new tag.
name: release-please

on:
  push:
    branches: [main]

# Read-only unless a job says otherwise (OpenSSF Scorecard's Token-Permissions, #246).
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # tag, GitHub Release, and the release branch
      pull-requests: write  # open and update the release PR
      actions: write        # start release.yml for the new tag
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag pushed with the workflow token doesn't trigger other workflows, so start the
      # signed build explicitly. It still waits for approval in the `release` environment.
      - name: Start the signed build for the new tag
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
