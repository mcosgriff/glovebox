# OpenSSF Scorecard (#246): how the repository's own practices look from outside (pinned actions,
# branch protection, token permissions, signed releases and so on). It reports to code scanning and
# the README badge; it never blocks anything.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  # Scorecard's branch-protection check reads these settings, so a change to them re-scores.
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Upload the results to code scanning.
      security-events: write
      # Publish the results, which is what the badge shows.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
