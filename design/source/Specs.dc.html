<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Torque and fastener specs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
input::placeholder{color:#6A6F76}
</style>
</helmet>
<div style="width: 390px; min-height: 1260px; box-sizing: border-box; background: #F4F3EF; color: #17191C; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 0 8px">
    <a href="VehicleDetails.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #17191C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <div style="font-size: 20px; font-weight: 600">Torque &amp; fastener specs</div>
      <div style="font-size: 12px; color: #5A5F66">2019 4Runner · 4.0L V6</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 12px 20px 24px 20px">
    <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; border: 1.5px solid #B9B6AE">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A5F66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input aria-label="Search specs" placeholder="Search — drain plug, lug nut…" style="flex: 1; min-width: 0; border: 0; background: transparent; font-family: inherit; font-size: 15px; color: #17191C">
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
      <span style="font-size: 13px; font-weight: 700; color: #3A3E44; letter-spacing: 0.04em">SHOW TORQUE IN</span>
      <div role="radiogroup" aria-label="Torque units" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E9E7E0">
        <sc-for list="{{units}}" as="u" hint-placeholder-count="3">
          <button role="radio" aria-checked="{{u.active}}" onClick="{{u.pick}}" style="height: 36px; padding: 0 10px; border-radius: 9px; border: 0; font-family: inherit; font-size: 13px; font-weight: 600; background: {{u.bg}}; color: #17191C; box-shadow: {{u.shadow}}">{{u.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.pick}}" aria-pressed="{{c.active}}" style="height: 36px; padding: 0 12px; border-radius: 999px; font-family: inherit; font-size: 13px; font-weight: 600; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="background: #FFFFFF; border: 1px solid #DEDCD5; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
            <span style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
              <span style="display: flex; gap: 6px; flex-wrap: wrap">
                <span style="padding: 3px 8px; border-radius: 6px; background: #E9E7E0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; color: #3A3E44">{{r.size}}</span>
                <span style="padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: {{r.srcBg}}; color: {{r.srcFg}}">{{r.src}}</span>
              </span>
            </span>
            <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0">
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 22px; font-weight: 600; color: {{r.valColor}}">{{r.value}}</span>
              <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; color: #5A5F66">{{r.alt}}</span>
            </span>
          </div>
          <sc-if value="{{r.hasNote}}" hint-placeholder-val="{{ true }}">
            <div style="font-size: 13px; line-height: 1.4; color: #3A3E44">{{r.note}}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <button style="height: 52px; border-radius: 14px; border: 1.5px dashed #8A8E94; background: transparent; font-family: inherit; font-size: 15px; font-weight: 600; color: #17191C">+ Add a spec</button>
    <div style="font-size: 12px; line-height: 1.45; color: #5A5F66">Enter torque in any unit — it converts automatically. Always check the factory service manual; a wrong torque on lug nuts or drain plugs can cause damage.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1260}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { unit: 'ftlb', cat: 'all' };
}
renderVals() {
var self = this, unit = this.state.unit, cat = this.state.cat;
var D = [
{ c: 'engine', name: 'Oil drain plug', size: '14 mm', nm: 40, src: 'FACTORY', note: 'Replace the gasket every change.' },
{ c: 'engine', name: 'Oil filter cap', size: '64 mm cap wrench', nm: 25, src: 'FACTORY', note: 'New O-ring with each filter.' },
{ c: 'engine', name: 'Filter housing drain plug', size: '[SIZE]', nm: null, src: 'NEEDS VALUE', note: 'Use the drain pipe before removing the cap.' },
{ c: 'wheels', name: 'Lug nuts', size: '21 mm', nm: 112, src: 'FACTORY', note: 'Star pattern. Re-check after 50 mi.' },
{ c: 'wheels', name: 'Front caliper bracket bolts', size: '[SIZE]', nm: null, src: 'NEEDS VALUE', note: '' },
{ c: 'drive', name: 'Front diff fill / drain plugs', size: '24 mm', nm: null, src: 'NEEDS VALUE', note: 'Always loosen the fill plug first.' },
{ c: 'drive', name: 'Rear diff fill / drain plugs', size: '24 mm', nm: null, src: 'NEEDS VALUE', note: '' },
{ c: 'drive', name: 'Transfer case plugs', size: '24 mm', nm: null, src: 'YOUR ENTRY', nm2: null, note: 'Added by you · value pending' }
];
var conv = function (nm, u) {
if (u === 'nm') return Math.round(nm) + ' N·m';
if (u === 'inlb') return Math.round(nm * 8.8507 / 5) * 5 + ' in-lb';
return Math.round(nm * 0.73756) + ' ft-lb';
};
var others = { nm: ['ftlb', 'inlb'], ftlb: ['nm', 'inlb'], inlb: ['nm', 'ftlb'] };
var rows = D.filter(function (d) { return cat === 'all' || d.c === cat; }).map(function (d) {
var has = d.nm !== null;
var srcStyle = d.src === 'FACTORY' ? ['#DDEFEC', '#0F766E'] : (d.src === 'YOUR ENTRY' ? ['#E9E7E0', '#3A3E44'] : ['#FBE9DF', '#9A3412']);
return {
name: d.name, size: d.size, src: d.src, srcBg: srcStyle[0], srcFg: srcStyle[1],
value: has ? conv(d.nm, unit) : '[TORQUE]',
alt: has ? others[unit].map(function (u) { return conv(d.nm, u); }).join(' · ') : 'Tap to add',
valColor: has ? '#17191C' : '#9A3412',
note: d.note, hasNote: !!d.note
};
});
var U = [['nm', 'N·m'], ['ftlb', 'ft-lb'], ['inlb', 'in-lb']];
var C = [['all', 'All'], ['engine', 'Engine & oil'], ['wheels', 'Wheels & brakes'], ['drive', 'Driveline']];
return {
rows: rows,
units: U.map(function (u) {
var a = u[0] === unit;
return { label: u[1], active: a, bg: a ? '#FFFFFF' : 'transparent', shadow: a ? '0 1px 3px rgba(23,25,28,0.18)' : 'none', pick: function () { self.setState({ unit: u[0] }); } };
}),
cats: C.map(function (c) {
var a = c[0] === cat;
return { label: c[1], active: a, bg: a ? '#17191C' : '#FFFFFF', fg: a ? '#FFFFFF' : '#17191C', border: a ? '#17191C' : '#DEDCD5', pick: function () { self.setState({ cat: c[0] }); } };
})
};
}
}
</script>
</body>
</html>
