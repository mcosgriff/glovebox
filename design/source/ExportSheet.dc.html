<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Export history</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
input[type=checkbox]{accent-color:#C2410C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EF; color: #17191C; font-family: 'IBM Plex Sans', system-ui, sans-serif; position: relative; overflow: hidden">
  <div aria-hidden="true" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="height: 48px; font-size: 26px; font-weight: 700">History</div>
    <div style="height: 120px; border-radius: 16px; background: #FFFFFF"></div>
    <div style="height: 120px; border-radius: 16px; background: #FFFFFF"></div>
  </div>
  <a href="History.dc.html" aria-label="Close" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(14,16,18,0.55)"></a>

  <div role="dialog" aria-label="Export history" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F4F3EF; border-radius: 28px 28px 0 0; padding: 10px 20px 20px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 40px; height: 4px; border-radius: 2px; background: #B9B6AE; align-self: center"></div>
    <div style="font-size: 20px; font-weight: 700">Export history</div>

    <div role="radiogroup" aria-label="Format" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #E9E7E0">
      <sc-for list="{{formats}}" as="f" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{f.active}}" onClick="{{f.pick}}" style="height: 44px; border-radius: 9px; border: 0; font-family: inherit; font-size: 15px; font-weight: 600; color: #17191C; background: {{f.bg}}; box-shadow: {{f.shadow}}">{{f.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ev" style="font-size: 12px; font-weight: 600; color: #3A3E44">Vehicle</label>
        <select id="ev" style="width: 100%; height: 48px; border: 1.5px solid #B9B6AE; border-radius: 12px; background: #FFFFFF; padding: 0 10px; font-family: inherit; font-size: 15px; color: #17191C"><option>2019 4Runner</option><option>2011 GTI</option><option>All vehicles</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="er" style="font-size: 12px; font-weight: 600; color: #3A3E44">Dates</label>
        <select id="er" style="width: 100%; height: 48px; border: 1.5px solid #B9B6AE; border-radius: 12px; background: #FFFFFF; padding: 0 10px; font-family: inherit; font-size: 15px; color: #17191C"><option>All time</option><option>This year</option><option>Custom range…</option></select>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DEDCD5; border-radius: 16px; padding: 4px 16px">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #EEECE6; font-size: 15px"><input type="checkbox" checked style="width: 20px; height: 20px">Costs and notes</label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid #EEECE6; font-size: 15px"><input type="checkbox" checked style="width: 20px; height: 20px">Maintenance schedule &amp; recalls</label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; color: {{photoColor}}"><input type="checkbox" checked="{{photosOn}}" disabled="{{photosOff}}" style="width: 20px; height: 20px">{{photoLabel}}</label>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; color: #3A3E44">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>
      {{filename}}
    </div>
    <div style="font-size: 12px; line-height: 1.45; color: #9A3412">Exported files aren't encrypted. Android will ask where to save or share it.</div>

    <a href="History.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 14px; background: #C2410C; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Export 4 records</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { fmt: 'pdf' };
}
renderVals() {
var self = this, fmt = this.state.fmt, md = fmt === 'md';
return {
formats: [['pdf', 'PDF'], ['md', 'Markdown']].map(function (f) {
var a = f[0] === fmt;
return { label: f[1], active: a, bg: a ? '#FFFFFF' : 'transparent', shadow: a ? '0 1px 3px rgba(23,25,28,0.18)' : 'none', pick: function () { self.setState({ fmt: f[0] }); } };
}),
photosOn: !md, photosOff: md,
photoColor: md ? '#6A6F76' : '#17191C',
photoLabel: md ? 'Receipt photos (PDF only)' : 'Receipt photos',
filename: 'glovebox-4runner-2026-10-10.' + (md ? 'md' : 'pdf')
};
}
}
</script>
</body>
</html>
