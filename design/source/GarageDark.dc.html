<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F59E6B}a:hover{color:#FDBA74}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #121416; color: #EDEBE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px 20px">
    <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.01em">Garage</div>
    <button aria-label="Add vehicle" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #4A4F55; background: transparent; display: flex; align-items: center; justify-content: center; color: #EDEBE6">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    </button>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 0 20px; overflow: hidden">
    <div style="background: #24282D; border: 1px solid #343A40; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 20px; font-weight: 700">2019 4Runner</div>
          <div style="font-size: 13px; color: #A5A9AF">SR5 · 4WD · 4.0L V6</div>
        </div>
        <div style="padding: 5px 10px; border-radius: 999px; background: #FDBA74; color: #17191C; font-size: 12px; font-weight: 700">1 OVERDUE</div>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 12px; color: #A5A9AF">Odometer</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 26px; font-weight: 600">68,412 <span style="font-size: 14px; color: #A5A9AF">mi</span></div>
        </div>
        <button style="height: 48px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #5A5F66; background: transparent; color: #EDEBE6; font-family: inherit; font-size: 13px; font-weight: 600">Update mileage</button>
      </div>
    </div>

    <a href="Recalls.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #3A2418; border: 1.5px solid #F08A4B; color: #EDEBE6; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F59E6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 700">1 open recall · Fuel pump</span>
        <span style="font-size: 12px; color: #C4C1BA">Free repair at a Toyota dealer</span>
      </span>
      <span style="font-size: 18px; color: #F59E6B" aria-hidden="true">›</span>
    </a>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 16px; font-weight: 700">Coming up</div>
      <a href="Reminders.dc.html" style="min-height: 48px; margin: -16px 0; display: flex; align-items: center; font-size: 13px; font-weight: 600">Whichever comes first ›</a>
    </div>

    <div style="background: #1C1F23; border: 1px solid #2E3338; border-radius: 16px; padding: 4px 16px">
      <sc-for list="{{due}}" as="d" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid #2A2E33">
          <div style="display: flex; justify-content: space-between; gap: 8px">
            <span style="font-size: 15px; font-weight: 600">{{d.name}}</span>
            <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 13px; font-weight: 600; color: {{d.color}}">{{d.status}}</span>
          </div>
          <div style="height: 6px; border-radius: 3px; background: #2E3338; overflow: hidden">
            <div style="height: 6px; border-radius: 3px; width: {{d.pct}}; background: {{d.color}}"></div>
          </div>
          <div style="font-size: 12px; color: #A5A9AF">{{d.detail}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <a href="PartsLogDark.dc.html" style="position: absolute; right: 20px; bottom: 96px; height: 56px; padding: 0 22px 0 18px; border-radius: 18px; background: #F08A4B; color: #17191C; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,0.5)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    Log service
  </a>

  <nav style="height: 80px; background: #1C1F23; border-top: 1px solid #2E3338; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="GarageDark.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #EDEBE6; text-decoration: none; font-size: 12px; font-weight: 700">
      <div style="width: 56px; height: 30px; border-radius: 15px; background: #3A2418; display: flex; align-items: center; justify-content: center; color: #F59E6B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12"></path><path d="M7 21v-7h10v7"></path></svg></div>
      Garage
    </a>
    <a href="HistoryDark.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A5A9AF; text-decoration: none; font-size: 12px; font-weight: 500">
      <div style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></div>
      History
    </a>
    <a href="Reminders.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A5A9AF; text-decoration: none; font-size: 12px; font-weight: 500">
      <div style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg></div>
      Reminders
    </a>
    <a href="SettingsDark.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A5A9AF; text-decoration: none; font-size: 12px; font-weight: 500">
      <div style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></div>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var orange = '#F59E6B', teal = '#5EEAD4', ink = '#C4C1BA';
return {
due: [
{ name: 'Tire rotation', status: 'Overdue 3,312 mi', color: orange, pct: '100%', detail: 'Every 5,000 mi · last at 60,100' },
{ name: 'Oil & filter · 0W-20', status: 'In 1,688 mi', color: ink, pct: '83%', detail: 'Every 10,000 mi or 12 mo · est. early Nov 2026' },
{ name: 'Engine & cabin air filters', status: 'In 6,588 mi', color: teal, pct: '78%', detail: 'Every 30,000 mi · last at 45,000' },
{ name: 'Transfer case & diff fluid', status: 'In 11,788 mi', color: teal, pct: '61%', detail: 'Every 30,000 mi (towing / off-road) · last at 50,200' }
]
};
}
}
</script>
</body>
</html>
