<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit service</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; min-height: 1120px; box-sizing: border-box; background: #F4F3EF; color: #17191C; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 0 8px">
    <a href="RecordDetail.dc.html" aria-label="Discard changes" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #17191C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <div style="font-size: 20px; font-weight: 600">Edit service</div>
      <div style="font-size: 12px; color: #5A5F66">2019 4Runner · logged Oct 10, 2026</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 20px; padding: 12px 20px 24px 20px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="edate" style="font-size: 12px; font-weight: 600; color: #3A3E44">Date</label>
        <input id="edate" value="Oct 10, 2026" style="width: 100%; min-width: 0; height: 48px; box-sizing: border-box; border: 1.5px solid #B9B6AE; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 15px; color: #17191C">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="eodo" style="font-size: 12px; font-weight: 600; color: #3A3E44">Odometer (mi)</label>
        <input id="eodo" value="{{odo}}" onChange="{{onOdo}}" inputmode="numeric" style="width: 100%; min-width: 0; height: 48px; box-sizing: border-box; border: 2px solid {{odoBorder}}; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; font-weight: 600; color: #17191C">
        <span style="font-size: 12px; color: {{odoNoteColor}}">{{odoNote}}</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; font-weight: 700; color: #3A3E44; letter-spacing: 0.04em">WORK DONE</div>
      <div style="background: #FFFFFF; border: 1px solid #DEDCD5; border-radius: 16px; padding: 4px 16px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid #EEECE6">
            <span style="flex: 1; font-size: 15px; color: {{it.color}}; text-decoration: {{it.strike}}">{{it.name}}</span>
            <button onClick="{{it.toggle}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1.5px solid {{it.btnBorder}}; background: transparent; font-family: inherit; font-size: 13px; font-weight: 600; color: {{it.btnColor}}">{{it.action}}</button>
          </div>
        </sc-for>
        <a href="LogService.dc.html" style="display: flex; align-items: center; min-height: 48px; font-size: 14px; font-weight: 600; text-decoration: none">+ Add item</a>
      </div>
    </div>

    <div style="background: {{impactBg}}; border: 1px solid {{impactBorder}}; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: {{impactTitleColor}}">WHAT THIS CHANGES</span>
      <sc-for list="{{impact}}" as="m" hint-placeholder-count="2">
        <span style="font-size: 14px; line-height: 1.45; color: #17191C">{{m.text}}</span>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ewho" style="font-size: 12px; font-weight: 600; color: #3A3E44">Who did it</label>
        <select id="ewho" style="width: 100%; height: 48px; border: 1.5px solid #B9B6AE; border-radius: 12px; background: #FFFFFF; padding: 0 10px; font-family: inherit; font-size: 15px; color: #17191C"><option>DIY</option><option>A shop</option></select>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="ecost" style="font-size: 12px; font-weight: 600; color: #3A3E44">Total cost</label>
        <input id="ecost" placeholder="$0.00" style="width: 100%; min-width: 0; height: 48px; box-sizing: border-box; border: 1.5px solid #B9B6AE; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; color: #17191C">
      </div>
    </div>

    <button onClick="{{save}}" style="height: 56px; border-radius: 16px; border: 0; background: #C2410C; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 600">Save changes</button>
    <a href="DeleteRecord.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; font-size: 15px; font-weight: 600; color: #B42318; text-decoration: none">Delete this record</a>
  </div>

  <sc-if value="{{saved}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 24px; min-height: 56px; border-radius: 14px; background: #17191C; color: #F4F3EF; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; box-shadow: 0 8px 24px rgba(23,25,28,0.25)">
      <span style="flex: 1; font-size: 14px">Changes saved · reminders updated</span>
      <button onClick="{{undo}}" style="height: 44px; padding: 0 12px; border: 0; background: transparent; font-family: inherit; font-size: 14px; font-weight: 700; color: #FDBA74">Undo</button>
      <a href="RecordDetail.dc.html" style="height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #F4F3EF; text-decoration: none">View</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1120}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { odo: '68,450', removed: {}, saved: false };
}
renderVals() {
var self = this, s = this.state;
var ORIG = 68412;
var n = parseInt(String(s.odo).replace(/[^0-9]/g, '') || '0', 10);
var fmt = function (x) { return x.toLocaleString('en-US'); };
var changed = n !== ORIG;
var I = [
['oil', 'Oil & filter change', 10000, 'Oil & filter goes back to due at 70,100 mi (from Jun 14 at 60,100).'],
['airf', 'Engine air filter', 30000, 'Engine air filter goes back to due at 75,000 mi.'],
['rot', 'Tire rotation', 5000, 'Tire rotation goes back to overdue (due at 65,100 mi).']
];
var impact = [];
var items = I.map(function (i) {
var gone = !!s.removed[i[0]];
if (gone) impact.push({ text: i[3] });
else if (changed) impact.push({ text: i[1].replace(' change', '') + ' next due ' + fmt(n + i[2]) + ' mi (was ' + fmt(ORIG + i[2]) + ').' });
return {
name: i[1], color: gone ? '#6A6F76' : '#17191C', strike: gone ? 'line-through' : 'none',
action: gone ? 'Keep' : 'Remove', btnBorder: gone ? '#17191C' : '#DEDCD5', btnColor: gone ? '#17191C' : '#B42318',
toggle: function () { var r = Object.assign({}, s.removed); r[i[0]] = !gone; self.setState({ removed: r }); }
};
});
var any = impact.length > 0;
if (!any) impact.push({ text: 'No changes to reminders.' });
var lowerThanPrev = n < 60100;
return {
odo: s.odo, items: items, impact: impact, saved: s.saved,
odoBorder: changed ? '#C2410C' : '#B9B6AE',
odoNote: lowerThanPrev ? 'Lower than the previous service (60,100)' : (changed ? 'Was ' + fmt(ORIG) : 'Unchanged'),
odoNoteColor: lowerThanPrev ? '#B42318' : (changed ? '#9A3412' : '#5A5F66'),
impactBg: any ? '#FBE9DF' : '#FFFFFF', impactBorder: any ? '#F3C9B1' : '#DEDCD5', impactTitleColor: any ? '#9A3412' : '#5A5F66',
onOdo: function (e) { self.setState({ odo: e.target.value, saved: false }); },
save: function () { self.setState({ saved: true }); },
undo: function () { self.setState({ odo: '68,412', removed: {}, saved: false }); }
};
}
}
</script>
</body>
</html>
