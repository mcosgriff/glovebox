<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm your vehicle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EF; color: #17191C; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 0 8px">
    <a href="Main.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #17191C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    </a>
    <div style="font-size: 20px; font-weight: 600">Is this your vehicle?</div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 8px 20px 20px 20px">
    <div style="background: #FFFFFF; color: #17191C; border: 1px solid #DEDCD5; box-shadow: 0 1px 2px rgba(23,25,28,0.06), 0 8px 24px rgba(23,25,28,0.06); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; color: #5A5F66; font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: 0.06em">JTEBU5JR4K5612345</div>
      <div style="font-size: 28px; font-weight: 700; line-height: 1.05; letter-spacing: -0.01em">2019 Toyota<br>4Runner</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <div style="padding: 5px 10px; border-radius: 999px; background: #FBE9DF; color: #9A3412; font-size: 13px; font-weight: 600">4WD</div>
        <div style="padding: 5px 10px; border-radius: 999px; background: #E9E7E0; color: #3A3E44; font-size: 13px; font-weight: 500">4.0L V6</div>
        <div style="padding: 5px 10px; border-radius: 999px; background: #E9E7E0; color: #3A3E44; font-size: 13px; font-weight: 500">SUV · 4-door</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DEDCD5; border-radius: 16px; padding: 4px 16px">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="8">
        <div style="display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #EEECE6; font-size: 14px">
          <span style="color: #5A5F66">{{f.k}}</span>
          <span style="font-weight: 600; text-align: right">{{f.v}}</span>
        </div>
      </sc-for>
      <div style="display: flex; align-items: center; gap: 6px; padding: 10px 0; font-size: 12px; color: #5A5F66">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
        Source: NHTSA vPIC decoder · tap any value to correct it
      </div>
    </div>

    <div style="display: flex; gap: 10px">
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <label for="trim" style="font-size: 12px; font-weight: 600; color: #3A3E44">Trim — please confirm</label>
        <select id="trim" style="width: 100%; height: 48px; border: 2px solid #C2410C; border-radius: 12px; background: #FFFFFF; padding: 0 10px; font-family: inherit; font-size: 15px; color: #17191C">
          <option>SR5</option>
          <option>SR5 Premium</option>
          <option>TRD Off-Road</option>
          <option>TRD Off-Road Premium</option>
          <option>Limited</option>
          <option>TRD Pro</option>
        </select>
      </div>
      <div style="width: 128px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px">
        <label for="odo" style="font-size: 12px; font-weight: 600; color: #3A3E44">Odometer (mi)</label>
        <input id="odo" value="68,412" inputmode="numeric" style="width: 100%; min-width: 0; height: 48px; box-sizing: border-box; border: 1.5px solid #B9B6AE; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; font-weight: 600; color: #17191C">
      </div>
    </div>

    <div style="flex: 1"></div>
    <a href="Schedule.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #C2410C; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600">Next: maintenance schedule</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
fields: [
{ k: 'Body class', v: 'SUV / MPV' },
{ k: 'Drive type', v: '4WD / 4x4 (part-time)' },
{ k: 'Engine', v: '4.0L V6 · 1GR-FE · 270 hp' },
{ k: 'Fuel', v: 'Gasoline' },
{ k: 'Transmission', v: '5-speed automatic' },
{ k: 'GVWR', v: 'Class 1D · 6,001–7,000 lb' },
{ k: 'Built in', v: 'Tahara, Japan' },
{ k: 'Recalls (NHTSA)', v: '2 found · 1 open' }
]
};
}
}
</script>
</body>
</html>
