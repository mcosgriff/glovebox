<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unlock</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 120px 24px 48px 24px; gap: 16px">
  <div style="width: 72px; height: 72px; border-radius: 20px; background: #C2410C; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"></path></svg>
  </div>
  <div style="font-size: 28px; font-weight: 700">Glovebox</div>
  <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{t.muted}}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    Your data is locked and encrypted
  </div>

  <div style="flex: 1"></div>

  <a href="Garage.dc.html" aria-label="Unlock with fingerprint" style="width: 96px; height: 96px; border-radius: 48px; border: 2px solid {{t.ring}}; background: {{t.ringBg}}; display: flex; align-items: center; justify-content: center; color: {{t.ring}}">
    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path><path d="M2 12a10 10 0 0 1 18-6"></path><path d="M2 16h.01"></path><path d="M21.8 16c.2-2 .131-5.354 0-6"></path><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path><path d="M8.65 22c.21-.66.45-1.32.57-2"></path><path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path></svg>
  </a>
  <div style="font-size: 15px; font-weight: 600">Touch the sensor to open your Glovebox</div>
  <a href="Garage.dc.html" style="min-height: 48px; display: flex; align-items: center; font-size: 14px; font-weight: 600; padding: 0 12px; color: {{t.link}}">Use device PIN instead</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var dark = (this.props.theme || 'light') === 'dark';
return {
t: dark
? { bg: '#17191C', ink: '#F4F3EF', muted: '#B9B6AE', ring: '#FDBA74', ringBg: 'transparent', link: '#FDBA74' }
: { bg: '#F4F3EF', ink: '#17191C', muted: '#5A5F66', ring: '#C2410C', ringBg: '#FBE9DF', link: '#C2410C' }
};
}
}
</script>
</body>
</html>
