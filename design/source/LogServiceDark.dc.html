<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log service (dark)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#F59E6B}a:hover{color:#FDBA74}
input[type=checkbox]{accent-color:#F08A4B}
input::placeholder,textarea::placeholder{color:#8A8E94}
</style>
</helmet>
<div style="width: 390px; min-height: 1240px; box-sizing: border-box; background: #121416; color: #EDEBE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 0 8px">
    <a href="GarageDark.dc.html" aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #EDEBE6">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
    </a>
    <div style="flex: 1; font-size: 20px; font-weight: 600">Log service</div>
    <div style="margin-right: 12px; padding: 6px 12px; border-radius: 999px; background: #24282D; font-size: 13px; font-weight: 600">2019 4Runner</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 22px; padding: 12px 20px 24px 20px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="date" style="font-size: 12px; font-weight: 600; color: #C4C1BA">Date</label>
        <input id="date" value="Oct 10, 2026" style="width: 100%; min-width: 0; height: 48px; box-sizing: border-box; border: 1.5px solid #4A4F55; border-radius: 12px; background: #1C1F23; padding: 0 12px; font-family: inherit; font-size: 15px; color: #EDEBE6">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="miles" style="font-size: 12px; font-weight: 600; color: #C4C1BA">Odometer (mi)</label>
        <input id="miles" value="68,412" inputmode="numeric" style="width: 100%; min-width: 0; height: 48px; box-sizing: border-box; border: 1.5px solid #4A4F55; border-radius: 12px; background: #1C1F23; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; font-weight: 600; color: #EDEBE6">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; font-weight: 700; color: #C4C1BA; letter-spacing: 0.04em">DUE NOW · ONE TAP</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{suggest}}" as="s" hint-placeholder-count="2">
          <button onClick="{{s.toggle}}" aria-pressed="{{s.on}}" style="height: 40px; padding: 0 14px; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; border: 1.5px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}">{{s.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; font-weight: 700; color: #C4C1BA; letter-spacing: 0.04em">WHAT WAS DONE?</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
          <button onClick="{{c.pick}}" aria-pressed="{{c.active}}" style="height: 52px; padding: 0 12px; border-radius: 14px; font-family: inherit; font-size: 14px; font-weight: 600; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 6px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">
            <span>{{c.label}}</span>
            <sc-if value="{{c.hasCount}}" hint-placeholder-val="{{ false }}">
              <span style="min-width: 22px; height: 22px; border-radius: 11px; background: #F08A4B; color: #17191C; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{c.count}}</span>
            </sc-if>
          </button>
        </sc-for>
      </div>

      <div style="background: #1C1F23; border: 1px solid #2E3338; border-radius: 16px; padding: 4px 16px">
        <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
          <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #2A2E33; font-size: 15px">
            <input type="checkbox" checked="{{it.on}}" onChange="{{it.toggle}}" style="width: 20px; height: 20px">
            <span style="flex: 1">{{it.label}}</span>
            <span style="font-size: 12px; color: #A5A9AF">{{it.hint}}</span>
          </label>
        </sc-for>
        <button style="height: 44px; border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 14px; font-weight: 600; color: #F59E6B">+ Add custom item</button>
      </div>
    </div>

    <div style="background: #24282D; border: 1px solid #343A40; color: #EDEBE6; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.4">
      <span style="font-weight: 700">{{summaryCount}}</span> · {{summaryText}}
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; font-weight: 700; color: #C4C1BA; letter-spacing: 0.04em">WHO DID IT?</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border: 1.5px solid #EDEBE6; border-radius: 14px; overflow: hidden">
        <button onClick="{{setDiy}}" aria-pressed="{{isDiy}}" style="height: 46px; border: 0; font-family: inherit; font-size: 15px; font-weight: 600; background: {{diyBg}}; color: {{diyFg}}">I did (DIY)</button>
        <button onClick="{{setShop}}" aria-pressed="{{isShop}}" style="height: 46px; border: 0; font-family: inherit; font-size: 15px; font-weight: 600; background: {{shopBg}}; color: {{shopFg}}">A shop</button>
      </div>
      <sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="shop" style="font-size: 12px; font-weight: 600; color: #C4C1BA">Shop name</label>
          <input id="shop" placeholder="e.g. dealer or local shop" style="width: 100%; min-width: 0; height: 48px; box-sizing: border-box; border: 1.5px solid #4A4F55; border-radius: 12px; background: #1C1F23; padding: 0 12px; font-family: inherit; font-size: 15px; color: #EDEBE6">
        </div>
      </sc-if>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="cost" style="font-size: 12px; font-weight: 600; color: #C4C1BA">Total cost</label>
        <input id="cost" placeholder="$0.00" style="width: 100%; min-width: 0; height: 48px; box-sizing: border-box; border: 1.5px solid #4A4F55; border-radius: 12px; background: #1C1F23; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; color: #EDEBE6">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 600; color: #C4C1BA">Receipt / photo</span>
        <button style="height: 48px; border: 1.5px dashed #6A6F76; border-radius: 12px; background: transparent; font-family: inherit; font-size: 14px; font-weight: 600; color: #C4C1BA; display: flex; align-items: center; justify-content: center; gap: 6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          Attach
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="notes" style="font-size: 12px; font-weight: 600; color: #C4C1BA">Notes (part numbers, oil brand, torque specs…)</label>
      <textarea id="notes" rows="3" placeholder="Optional" style="box-sizing: border-box; border: 1.5px solid #4A4F55; border-radius: 12px; background: #1C1F23; padding: 12px; font-family: inherit; font-size: 15px; color: #EDEBE6; resize: none"></textarea>
    </div>

    <a href="HistoryDark.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #F08A4B; color: #17191C; text-decoration: none; font-size: 16px; font-weight: 600">Save service</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 'engine', checked: { oil: true, airf: true, rot: true }, who: 'diy' };
}
toggle(id) {
var c = Object.assign({}, this.state.checked);
c[id] = !c[id];
this.setState({ checked: c });
}
renderVals() {
var self = this;
var CATS = [
{ id: 'engine', label: 'Oil & engine', items: [['oil', 'Oil & filter change', '0W-20 · 6.2 qt'], ['airf', 'Engine air filter', ''], ['plugs', 'Spark plugs', '120k mi'], ['belt', 'Serpentine belt', ''], ['pcv', 'PCV valve', '']] },
{ id: 'tires', label: 'Tires & wheels', items: [['rot', 'Tire rotation', '5k mi'], ['bal', 'Balance', ''], ['align', 'Alignment', ''], ['newtires', 'New tires', ''], ['flat', 'Flat repair', '']] },
{ id: 'brakes', label: 'Brakes', items: [['fpads', 'Front pads', ''], ['rpads', 'Rear pads', ''], ['rotors', 'Rotors', ''], ['bfluid', 'Brake fluid flush', ''], ['binsp', 'Brake inspection', '']] },
{ id: 'fluids', label: 'Fluids', items: [['cool', 'Coolant', '100k first'], ['atf', 'Transmission (ATF)', ''], ['ps', 'Power steering fluid', ''], ['washer', 'Washer fluid', '']] },
{ id: 'fourwd', label: '4WD & driveline', items: [['tcase', 'Transfer case fluid', ''], ['fdiff', 'Front differential fluid', ''], ['rdiff', 'Rear differential fluid', ''], ['shaft', 'Driveshaft grease', '']] },
{ id: 'cabin', label: 'Cabin & electrical', items: [['cabf', 'Cabin air filter', ''], ['wipers', 'Wiper blades', ''], ['batt', 'Battery', ''], ['bulbs', 'Bulbs', '']] },
{ id: 'insp', label: 'Inspection', items: [['multi', 'Multi-point inspection', ''], ['emis', 'Emissions test', ''], ['recall', 'Recall work', '']] },
{ id: 'other', label: 'Other', items: [['acc', 'Accessory install', ''], ['body', 'Body / glass', ''], ['detail', 'Detail / wash', '']] }
];
var checked = this.state.checked;
var names = {};
CATS.forEach(function (c) { c.items.forEach(function (i) { names[i[0]] = i[1]; }); });
var cats = CATS.map(function (c) {
var active = c.id === self.state.cat;
var count = c.items.filter(function (i) { return checked[i[0]]; }).length;
return {
label: c.label, active: active, count: count, hasCount: count > 0,
bg: active ? '#EDEBE6' : '#1C1F23', fg: active ? '#17191C' : '#EDEBE6', border: active ? '#EDEBE6' : '#2E3338',
pick: function () { self.setState({ cat: c.id }); }
};
});
var cur = CATS.filter(function (c) { return c.id === self.state.cat; })[0];
var items = cur.items.map(function (i) {
return { label: i[1], hint: i[2], on: !!checked[i[0]], toggle: function () { self.toggle(i[0]); } };
});
var suggest = [['rot', 'Tire rotation · overdue'], ['oil', 'Oil & filter · due soon']].map(function (s) {
var on = !!checked[s[0]];
return {
label: (on ? '✓ ' : '+ ') + s[1], on: on,
bg: on ? '#3A2418' : '#1C1F23', fg: on ? '#FDBA74' : '#EDEBE6', border: on ? '#F08A4B' : '#4A4F55',
toggle: function () { self.toggle(s[0]); }
};
});
var sel = Object.keys(checked).filter(function (k) { return checked[k]; }).map(function (k) { return names[k]; });
var diy = this.state.who === 'diy';
return {
cats: cats, items: items, suggest: suggest,
summaryCount: sel.length + (sel.length === 1 ? ' item' : ' items'),
summaryText: sel.length ? sel.join(', ') : 'Pick what was done above',
isDiy: diy, isShop: !diy,
diyBg: diy ? '#EDEBE6' : '#1C1F23', diyFg: diy ? '#17191C' : '#EDEBE6',
shopBg: diy ? '#1C1F23' : '#EDEBE6', shopFg: diy ? '#EDEBE6' : '#17191C',
setDiy: function () { self.setState({ who: 'diy' }); },
setShop: function () { self.setState({ who: 'shop' }); }
};
}
}
</script>
</body>
</html>
