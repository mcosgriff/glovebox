<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F3EF; color: #17191C; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 8px 20px">
    <a href="GarageMulti.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; color: #17191C; text-decoration: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      All vehicles
    </a>
    <a href="VehicleDetails.dc.html" aria-label="Vehicle details" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid #B9B6AE; display: flex; align-items: center; justify-content: center; color: #17191C">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>
    </a>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 4px 20px 0 20px; overflow: hidden">
    <div style="background: #FFFFFF; color: #17191C; border: 1px solid #DEDCD5; box-shadow: 0 1px 2px rgba(23,25,28,0.06), 0 8px 24px rgba(23,25,28,0.06); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 22px; font-weight: 700">2019 4Runner</div>
          <div style="font-size: 13px; color: #5A5F66">SR5 · 4WD · 4.0L V6</div>
        </div>
        <div style="padding: 5px 10px; border-radius: 999px; background: #FBE9DF; color: #9A3412; font-size: 12px; font-weight: 700">1 OVERDUE</div>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <div style="font-size: 12px; color: #5A5F66">Odometer</div>
          <div style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 26px; font-weight: 600">68,412 <span style="font-size: 14px; color: #5A5F66">mi</span></div>
        </div>
        <a href="UpdateMileage.dc.html" style="height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #B9B6AE; color: #17191C; text-decoration: none; display: flex; align-items: center; font-size: 13px; font-weight: 600">Update mileage</a>
      </div>
    </div>

    <a href="Recalls.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: #FBE9DF; border: 1.5px solid #C2410C; color: #17191C; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
      <span style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 14px; font-weight: 700">1 open recall · Fuel pump</span>
        <span style="font-size: 12px; color: #5A5F66">Free repair at a Toyota dealer</span>
      </span>
      <span style="font-size: 18px; color: #C2410C" aria-hidden="true">›</span>
    </a>

    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-size: 16px; font-weight: 700">Coming up</div>
      <a href="Reminders.dc.html" style="font-size: 13px; font-weight: 600">Whichever comes first ›</a>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DEDCD5; border-radius: 16px; padding: 4px 16px">
      <sc-for list="{{due}}" as="d" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid #EEECE6">
          <div style="display: flex; justify-content: space-between; gap: 8px">
            <span style="font-size: 15px; font-weight: 600">{{d.name}}</span>
            <span style="font-size: 13px; font-weight: 600; color: {{d.color}}">{{d.status}}</span>
          </div>
          <div style="height: 6px; border-radius: 3px; background: #EEECE6; overflow: hidden">
            <div style="height: 6px; border-radius: 3px; width: {{d.pct}}; background: {{d.color}}"></div>
          </div>
          <div style="font-size: 12px; color: #5A5F66">{{d.detail}}</div>
        </div>
      </sc-for>
    </div>

  </div>

  <a href="LogService.dc.html" style="position: absolute; right: 20px; bottom: 96px; height: 56px; padding: 0 22px 0 18px; border-radius: 18px; background: #C2410C; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; box-shadow: 0 6px 18px rgba(23,25,28,0.25)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
    Log service
  </a>

  <nav style="height: 80px; background: #FFFFFF; border-top: 1px solid #DEDCD5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="Garage.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #17191C; text-decoration: none; font-size: 12px; font-weight: 700">
      <div style="width: 56px; height: 30px; border-radius: 15px; background: #FBE9DF; display: flex; align-items: center; justify-content: center; color: #C2410C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12"></path><path d="M7 21v-7h10v7"></path></svg></div>
      Garage
    </a>
    <a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4F545B; text-decoration: none; font-size: 12px; font-weight: 500">
      <div style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></div>
      History
    </a>
    <a href="Upcoming.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4F545B; text-decoration: none; font-size: 12px; font-weight: 500">
      <div style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg></div>
      Reminders
    </a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4F545B; text-decoration: none; font-size: 12px; font-weight: 500">
      <div style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg></div>
      More
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var orange = '#C2410C', teal = '#0F766E', ink = '#3A3E44';
return {
due: [
{ name: 'Tire rotation', status: 'Overdue 3,312 mi', color: orange, pct: '100%', detail: 'Every 5,000 mi · last at 60,100' },
{ name: 'Oil & filter · 0W-20', status: 'In 1,688 mi', color: ink, pct: '83%', detail: 'Every 10,000 mi or 12 mo · est. early Nov 2026' },
{ name: 'Engine & cabin air filters', status: 'In 6,588 mi', color: teal, pct: '78%', detail: 'Every 30,000 mi · last at 45,000' },
{ name: 'Transfer case & diff fluid', status: 'In 11,788 mi', color: teal, pct: '61%', detail: 'Every 30,000 mi (towing / off-road) · last at 50,200' }
]
};
}
}
</script>
</body>
</html>
