<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delete vehicle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
</style>
</helmet>
<div style="width: 390px; min-height: 900px; box-sizing: border-box; background: #F4F3EF; color: #17191C; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 0 8px">
    <a href="VehicleDetails.dc.html" aria-label="Cancel" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #17191C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
    </a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 0 20px 24px 20px">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: #FDE8E7; color: #B42318; display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 26px; font-weight: 700; line-height: 1.15">Delete 2019 4Runner and all its data?</div>
      <div style="font-size: 15px; line-height: 1.45; color: #4F545B">This permanently removes from this phone:</div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DEDCD5; border-radius: 16px; padding: 4px 16px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="5">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-bottom: 1px solid #EEECE6; font-size: 14px"><span>{{i.k}}</span><span style="font-weight: 600">{{i.v}}</span></div>
      </sc-for>
      <div style="padding: 10px 0; font-size: 12px; color: #5A5F66">Backup files you've already saved aren't changed.</div>
    </div>

    <div style="display: flex; gap: 8px">
      <a href="ExportSheet.dc.html" style="flex: 1; height: 46px; border-radius: 12px; border: 1.5px solid #17191C; color: #17191C; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Export first</a>
      <a href="VehicleDetails.dc.html" style="flex: 1; height: 46px; border-radius: 12px; border: 1.5px solid #17191C; color: #17191C; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">Archive instead</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="dv" style="font-size: 13px; font-weight: 600; color: #3A3E44">Type <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace">4Runner</span> to confirm</label>
      <input id="dv" value="{{typed}}" onChange="{{onType}}" autocomplete="off" style="width: 100%; min-width: 0; height: 52px; box-sizing: border-box; border: 2px solid {{inputBorder}}; border-radius: 12px; background: #FFFFFF; padding: 0 12px; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 16px; color: #17191C">
    </div>

    <sc-if value="{{ready}}" hint-placeholder-val="{{ false }}">
      <a href="GarageMulti.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #B42318; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600">Delete vehicle permanently</a>
    </sc-if>
    <sc-if value="{{notReady}}" hint-placeholder-val="{{ true }}">
      <button disabled style="height: 56px; border-radius: 16px; border: 0; background: #E9E7E0; color: #6A6F76; font-family: inherit; font-size: 16px; font-weight: 600">Delete vehicle permanently</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { typed: '' };
}
renderVals() {
var self = this, t = this.state.typed;
var ok = t.trim().toLowerCase() === '4runner';
return {
typed: t, ready: ok, notReady: !ok,
inputBorder: ok ? '#B42318' : '#B9B6AE',
onType: function (e) { self.setState({ typed: e.target.value }); },
items: [
{ k: 'Service records', v: '4' },
{ k: 'Receipt & parts photos', v: '[N]' },
{ k: 'Schedule items & reminders', v: '9' },
{ k: 'Torque & fastener specs', v: '8' },
{ k: 'Recall status & notes', v: '2' }
]
};
}
}
</script>
</body>
</html>
