<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recommended maintenance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
input[type=checkbox]{accent-color:#C2410C}
</style>
</helmet>
<div style="width: 390px; min-height: 1180px; box-sizing: border-box; background: #F4F3EF; color: #17191C; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 0 8px">
    <a href="Decoded.dc.html" aria-label="Back" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center; color: #17191C">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path></svg>
    </a>
    <div style="font-size: 20px; font-weight: 600">Recommended maintenance</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 18px; padding: 8px 20px 24px 20px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 15px; line-height: 1.45; color: #4F545B">We found Toyota's schedule for your <span style="font-weight: 600; color: #17191C">2019 4Runner 4.0L V6</span>. Pick what to track — you can edit any interval later.</div>
      <div style="font-size: 12px; color: #5A5F66">Source: Toyota Warranty &amp; Maintenance Guide</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; font-weight: 700; color: #3A3E44; letter-spacing: 0.04em">HOW DO YOU DRIVE IT?</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1.5px solid #17191C; border-radius: 14px; overflow: hidden">
        <button onClick="{{setNormal}}" aria-pressed="{{isNormal}}" style="height: 56px; border: 0; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: {{nBg}}; color: {{nFg}}">
          <span style="font-size: 15px; font-weight: 600">Normal</span>
          <span style="font-size: 12px; opacity: 0.85">Commuting, highway</span>
        </button>
        <button onClick="{{setSevere}}" aria-pressed="{{isSevere}}" style="height: 56px; border: 0; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: {{sBg}}; color: {{sFg}}">
          <span style="font-size: 15px; font-weight: 600">Severe</span>
          <span style="font-size: 12px; opacity: 0.85">Towing, off-road, dusty</span>
        </button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="font-size: 13px; font-weight: 700; color: #3A3E44; letter-spacing: 0.04em">{{count}} OF {{total}} SELECTED</div>
      <button onClick="{{toggleAll}}" style="height: 36px; border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 14px; font-weight: 600; color: #C2410C">{{allLabel}}</button>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DEDCD5; border-radius: 16px; padding: 4px 16px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 6px 0; border-bottom: 1px solid #EEECE6">
          <input type="checkbox" checked="{{r.on}}" onChange="{{r.toggle}}" style="width: 20px; height: 20px; flex-shrink: 0">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
            <span style="font-size: 13px; color: {{r.ivColor}}; font-family: 'IBM Plex Mono', ui-monospace, monospace">{{r.interval}}</span>
          </span>
          <sc-if value="{{r.changed}}" hint-placeholder-val="{{ false }}">
            <span style="padding: 3px 8px; border-radius: 999px; background: #FBE9DF; color: #9A3412; font-size: 11px; font-weight: 700">SEVERE</span>
          </sc-if>
          <a href="EditInterval.dc.html" aria-label="Edit interval" style="width: 48px; height: 48px; border-radius: 24px; margin: -4px; display: flex; align-items: center; justify-content: center; color: #3A3E44; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
          </a>
        </label>
      </sc-for>
      <button style="height: 48px; border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 14px; font-weight: 600; color: #C2410C">+ Add your own item</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="lastsvc" style="font-size: 12px; font-weight: 600; color: #3A3E44">Know when these were last done? (optional)</label>
      <select id="lastsvc" style="width: 100%; height: 48px; border: 1.5px solid #B9B6AE; border-radius: 12px; background: #FFFFFF; padding: 0 10px; font-family: inherit; font-size: 15px; color: #17191C">
        <option>I'll enter them as I go</option>
        <option>Import from a dealer service record</option>
        <option>Assume everything was done on schedule</option>
      </select>
    </div>

    <a href="Garage.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 12px; background: #C2410C; color: #FFFFFF; text-decoration: none; font-size: 16px; font-weight: 600">Track {{count}} items</a>
    <a href="Garage.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; font-weight: 500; padding: 0 4px">Skip — I'll set up reminders myself</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { severe: false, off: {} };
}
renderVals() {
var self = this;
var sev = this.state.severe, off = this.state.off;
var S = [
['oil', 'Oil & filter (0W-20)', '10,000 mi / 12 mo', '5,000 mi / 6 mo'],
['rot', 'Tire rotation', '5,000 mi / 6 mo', '5,000 mi / 6 mo'],
['eaf', 'Engine air filter', '30,000 mi', '15,000 mi'],
['caf', 'Cabin air filter', '30,000 mi', '15,000 mi'],
['tc', 'Transfer case & diff fluid', 'Inspect 30,000 mi', 'Replace 15,000 mi'],
['shaft', 'Grease propeller shafts', 'Inspect 15,000 mi', '5,000 mi'],
['brk', 'Brakes & brake fluid', 'Inspect 15,000 mi', 'Inspect 15,000 mi'],
['cool', 'Engine coolant', '100,000 mi, then 50,000', '100,000 mi, then 50,000'],
['plug', 'Spark plugs', '120,000 mi', '120,000 mi']
];
var rows = S.map(function (s) {
var changed = sev && s[2] !== s[3];
return {
name: s[1], interval: sev ? s[3] : s[2], changed: changed,
ivColor: changed ? '#9A3412' : '#5A5F66',
on: !off[s[0]],
toggle: function () { var n = Object.assign({}, off); n[s[0]] = !n[s[0]]; self.setState({ off: n }); }
};
});
var count = rows.filter(function (r) { return r.on; }).length;
var allOn = count === S.length;
return {
rows: rows, count: count, total: S.length,
allLabel: allOn ? 'Clear all' : 'Select all',
toggleAll: function () {
var n = {};
if (allOn) { S.forEach(function (s) { n[s[0]] = true; }); }
self.setState({ off: n });
},
isNormal: !sev, isSevere: sev,
nBg: sev ? '#FFFFFF' : '#17191C', nFg: sev ? '#17191C' : '#FFFFFF',
sBg: sev ? '#17191C' : '#FFFFFF', sFg: sev ? '#FFFFFF' : '#17191C',
setNormal: function () { self.setState({ severe: false }); },
setSevere: function () { self.setState({ severe: true }); }
};
}
}
</script>
</body>
</html>
