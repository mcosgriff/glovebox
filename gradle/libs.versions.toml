[versions]
# Built with Android Studio; keep AGP current via Studio's AGP Upgrade Assistant.
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
coroutines = "1.11.0"
serialization = "1.11.0"

core-ktx = "1.19.1"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"
compose-bom = "2026.09.00"
biometric = "1.1.0"
fragment = "1.9.1"
datastore = "1.2.1"
work = "2.12.0"

room = "3.0.3"
sqlite = "2.7.1"
sqlcipher = "4.19.1"
tink = "1.23.0"
ktor = "3.6.0"
camerax = "1.6.2"
pdf = "1.0.0-beta01"
# Barcode reading. Pure Java with no network code; ML Kit was ruled out because it uploads usage logs.
zxing = "3.5.4"
# Reads the odometer off the dash (#64). Tesseract and Leptonica as native libraries: no network code, no
# permissions, one dependency (androidx.annotation). ML Kit's text recognition was ruled out for the same
# reason as its barcode reader. Published on JitPack only; see settings.gradle.kts.
tesseract4android = "4.9.0"
# Argon2id for the backup password. Only the lightweight API is used (no provider), so R8 keeps little of it.
bouncycastle = "1.86"

hilt = "2.60.1"
# Build-time only: lists the bundled libraries and their licences for the About screen. No runtime library is added.
aboutlibraries = "15.2.0"
hilt-androidx = "1.4.0"
# Baseline profile (#222): the generator and the startup benchmark in :baselineprofile, and the Gradle plugin
# that builds their variants of the app and copies the profile into it. Nothing of benchmark ships in the app.
benchmark = "1.5.0"
# Writes the app's baseline profile on first launch, so a sideloaded install is compiled from it too.
profileinstaller = "1.4.1"

junit = "4.13.2"
jsonSchemaValidator = "3.0.8"
turbine = "1.2.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }

room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
room-testing = { module = "androidx.room3:room3-testing", version.ref = "room" }
androidx-sqlite = { module = "androidx.sqlite:sqlite-ktx", version.ref = "sqlite" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
androidx-pdf-compose = { module = "androidx.pdf:pdf-compose", version.ref = "pdf" }
androidx-pdf-document-service = { module = "androidx.pdf:pdf-document-service", version.ref = "pdf" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
# Reads the VIN barcodes (#161): the C++ successor to ZXing, far better on blurred and unevenly lit camera frames.
# No network code: checked in its native library's imported functions (none are network calls) and its POM
# (it depends only on the Kotlin standard library and CameraX). Check again on an upgrade.
zxing-cpp = { module = "io.github.zxing-cpp:android", version = "2.3.0" }
# Reads the words and their positions out of a Carfax report PDF (#160), on the phone. Apache 2.0; none of its
# classes touch java.net (checked). Its BouncyCastle (for encrypted PDFs only) is excluded in app/build.gradle.kts:
# the app has its own, newer one.
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version = "2.0.27.0" }
tesseract4android = { module = "cz.adaptech.tesseract4android:tesseract4android", version.ref = "tesseract4android" }
# Tests that have to run on a phone or emulator (app/src/androidTest); nothing here ships in the app.
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-core = { module = "androidx.test:core", version = "1.7.0" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.4.0" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
# Test only: runs Android's SQLite on the JVM so the database migrations are tested by `./gradlew build`.
robolectric = { module = "org.robolectric:robolectric", version = "4.16" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-androidx" }

junit = { module = "junit:junit", version.ref = "junit" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room3", version.ref = "room" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
